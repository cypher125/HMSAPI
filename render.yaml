services:
  - type: web
    plan: free
    name: hms_backend
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn hms_backend.asgi:application -k uvicorn.workers.UvicornWorker' 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neondb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4